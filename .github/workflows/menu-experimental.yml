name: Menú y tutorial experimental

on:
  push:
    paths:
      - 'experimentos/catalogo-presupuesto/**'
      - '.github/workflows/menu-experimental.yml'
      - 'tests/browser/package*.json'
  pull_request:
    paths:
      - 'experimentos/catalogo-presupuesto/**'
      - '.github/workflows/menu-experimental.yml'
      - 'tests/browser/package*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  menu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci --prefix tests/browser
      - name: Chromium
        working-directory: tests/browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Tutorial y menú en navegador
        env:
          PLAYWRIGHT_MODULE: ../../../tests/browser/node_modules/playwright/index.mjs
          TEST_MENU_URL: http://127.0.0.1:8766/experimentos/catalogo-presupuesto/demo/menu.html
        run: |
          python3 -m http.server --bind 127.0.0.1 8766 > /tmp/menu-http.log 2>&1 &
          menu_server_pid=$!
          trap 'kill "$menu_server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent "$TEST_MENU_URL" > /dev/null; then break; fi
            sleep 0.25
          done
          curl --fail --silent "$TEST_MENU_URL" > /dev/null
          node experimentos/catalogo-presupuesto/tests/menu.browser.mjs
