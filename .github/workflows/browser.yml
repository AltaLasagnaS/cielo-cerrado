name: Interfaz en Chromium

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Dependencia aislada con versión fijada
        run: npm ci --prefix tests/browser
      - name: Chromium y bibliotecas del sistema
        working-directory: tests/browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Interfaz de desarrollo y archivo descargable sin red
        run: npm test --prefix tests/browser
      - name: Guardar diagnóstico del navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/browser/artifacts/
          if-no-files-found: ignore
          retention-days: 7
