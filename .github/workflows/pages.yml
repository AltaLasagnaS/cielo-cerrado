# Publicación en GitHub Pages: en cada push a main (o a mano desde la pestaña Actions) sube el
# index.html de la raíz, que ya es el juego completo en un solo archivo.
#
# Antes de publicar verifica que index.html esté al día con src/ (igual que la CI), para no subir
# una versión vieja del juego. Requiere Settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicación a la vez; si llega un push nuevo, la que está en curso termina igual.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: index.html al día con src/
        run: |
          npm run build
          git diff --exit-code -- index.html || (echo "::error::index.html no coincide con src/. Corré 'npm run build' y commiteá el resultado." && exit 1)
      - name: Armar el sitio
        run: |
          mkdir _site
          cp index.html _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
